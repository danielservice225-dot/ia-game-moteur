[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-game"
version = "0.1.0"
description = "Moteur ML pour simulation industrielle IA GAME"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pandas>=2.1,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "python-multipart>=0.0.9",
  "psutil>=5.9,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.5"]

[tool.setuptools]
packages = ["backend", "ml_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
