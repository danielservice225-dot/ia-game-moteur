name: Python tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check backend ml_engine tests scripts

  godot:
    name: Godot 4 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Parse project and GDScript resources
        run: godot --headless --editor --path godot_game --quit
      - name: Run industrial simulation tests
        run: godot --headless --path godot_game --script res://tests/industrial_simulation_test.gd
