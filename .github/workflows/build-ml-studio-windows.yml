name: Build IA GAME ML Studio for Windows

on:
  push:
    branches: [feature/ml-studio-windows, main]
    tags: ['ml-studio-v*']
    paths:
      - "ml_studio/**"
      - "backend/**"
      - "ml_engine/**"
      - "pyproject.toml"
      - "requirements-ml-studio.txt"
      - "installer/**"
      - ".github/workflows/build-ml-studio-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-ml-studio.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name IA-GAME-ML-Studio --collect-all pandas --collect-all numpy --collect-all scipy --collect-all sklearn --collect-all joblib --collect-all uvicorn --collect-all fastapi --collect-all pydantic --collect-all psutil --hidden-import multipart --hidden-import backend.main --hidden-import ml_engine.pipeline --paths . ml_studio/app.py
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.6
        with:
          path: installer/IA-GAME-ML-Studio.iss
          options: /O+
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: IA-GAME-ML-Studio-Windows
          path: |
            dist/IA-GAME-ML-Studio.exe
            installer-output/IA-GAME-ML-Studio-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IA-GAME-ML-Studio.exe
            installer-output/IA-GAME-ML-Studio-Setup.exe
