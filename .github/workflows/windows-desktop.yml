name: Windows desktop executable

on:
  push:
    branches:
      - feature/native-desktop-trainer
    paths:
      - "desktop_app/**"
      - "ml_engine/**"
      - "backend/**"
      - "scripts/build_windows.ps1"
      - "requirements-windows.txt"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
      - name: Build native Windows application
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name IA_GAME_Trainer --paths . --collect-all PySide6 --collect-all pandas --collect-all numpy --collect-all scipy --collect-all sklearn --collect-all joblib --hidden-import sklearn.ensemble._forest --hidden-import sklearn.neighbors._partition_nodes desktop_app/main.py
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/IA_GAME_Trainer.exe"
          if (!(Test-Path $exe)) { throw "Executable not found: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) { throw "Executable is unexpectedly small ($($item.Length) bytes)." }
          Write-Host "Generated $($item.FullName), $($item.Length) bytes"
      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/IA_GAME_Trainer.exe package/
          Copy-Item README.md package/README-IA-GAME.md
          Compress-Archive -Path package/* -DestinationPath IA_GAME_Trainer-Windows-x64.zip -Force
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: IA-GAME-Trainer-Windows-x64
          path: IA_GAME_Trainer-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
