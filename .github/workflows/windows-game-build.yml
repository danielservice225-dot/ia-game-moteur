name: IA GAME Windows build

on:
  push:
    branches:
      - "feature/game-reference-design"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Export Godot game for Windows x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export Windows executable with Godot 4.4.1
        id: godot-export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./godot_game
          relative_export_path: ./dist
          presets_to_export: Windows Desktop
          export_debug: false
          archive_output: false
          cache: true

      - name: Validate Windows executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          echo "Export output:"
          find dist -maxdepth 4 -type f -printf '%p (%s bytes)\n'
          EXE="$(find dist -type f -iname 'IA-GAME.exe' -print -quit)"
          test -n "$EXE"
          test -s "$EXE"
          cp "$EXE" release/IA-GAME.exe
          file release/IA-GAME.exe
          test "$(od -An -tx1 -N2 release/IA-GAME.exe | tr -d ' \n')" = "4d5a"

      - name: Upload Windows game executable
        uses: actions/upload-artifact@v4
        with:
          name: IA-GAME-Windows-x64
          path: release/IA-GAME.exe
          if-no-files-found: error
          retention-days: 30

  installer:
    name: Create Windows installer
    needs: export
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exported game
        uses: actions/download-artifact@v4
        with:
          name: IA-GAME-Windows-x64
          path: dist

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "dist/IA-GAME.exe")) { throw "IA-GAME.exe missing from export artifact." }
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          & $iscc "/DSourceDir=$((Resolve-Path 'dist').Path)" "/DOutputDir=$((Resolve-Path 'release').Path)" "godot_game/installer/IA-GAME.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Copy-Item "dist/IA-GAME.exe" "release/IA-GAME.exe"
          Compress-Archive -Path "dist/IA-GAME.exe" -DestinationPath "release/IA-GAME-Windows-x64-Portable.zip" -Force
          Get-ChildItem release | Format-Table Name,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: IA-GAME-Windows-Installer
          path: |
            release/IA-GAME-Setup.exe
            release/IA-GAME.exe
            release/IA-GAME-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/IA-GAME-Setup.exe
            release/IA-GAME.exe
            release/IA-GAME-Windows-x64-Portable.zip
          generate_release_notes: true
